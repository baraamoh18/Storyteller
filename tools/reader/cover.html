<!-- The link-preview cover (1200 x 627) for the public demo. Next to it: tempest.jpg = panel 79 of chapter 094, background
     + characters composited, cropped to (0, 0, 940, 1180). Render with Playwright at 1200 x 627 with the site fonts
     (http://fonts.local/ routed to @fontsource woff2 files) and save as JPEG q90 to site/chapters/094-demo/cover.jpg. -->
<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="http://fonts.local/fonts.css">
<style>
  :root { --ink: #0b0a0d; --paper: #f1ece4; --muted: #a39d96; --red: #e5202e; }
  html, body { margin: 0; width: 1200px; height: 627px; background: var(--ink); overflow: hidden; }
  .dots { position: absolute; inset: 0; background: radial-gradient(circle, rgba(241,236,228,0.08) 1.1px, transparent 1.6px) 0 0 / 7px 7px; }
  .art { position: absolute; right: 0; top: 0; width: 560px; height: 627px; background: url(tempest.jpg) center 8% / cover; outline: 2px solid var(--paper); }
  .art::before { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, var(--ink) 0%, rgba(11,10,13,0) 22%); }
  .text { position: absolute; left: 64px; top: 70px; width: 560px; display: grid; gap: 22px; }
  .eyebrow { font: 500 15px "IBM Plex Mono", monospace; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); }
  .eyebrow b { color: var(--red); font-weight: 500; }
  h1 { margin: 0; font: 400 150px/0.86 "Bangers", sans-serif; color: var(--paper); text-shadow: 7px 7px 0 var(--red); letter-spacing: 0.01em; }
  .lede { font: 400 27px/1.32 "Archivo Narrow", sans-serif; color: var(--paper); margin: 0; }
  .lede strong { font-weight: 600; color: var(--paper); }
  .credit { font: 400 16px/1.4 "Archivo Narrow", sans-serif; color: var(--muted); border-left: 2px solid var(--red); padding-left: 12px; margin: 0; }
</style></head><body>
<div class="dots"></div>
<div class="art"></div>
<div class="text">
  <p class="eyebrow">Storyteller <b>/</b> a scroll-driven manhwa reader</p>
  <h1>The Duel</h1>
  <p class="lede">A webcomic chapter that plays like a film as you scroll: <strong>split into layers by AI</strong>, then directed scene by scene.</p>
  <p class="credit">Fan tech demo. The Beginning After the End by TurtleMe &amp; Fuyuki23 (Tapas).</p>
</div>
</body></html>
